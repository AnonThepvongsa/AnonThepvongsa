<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <title>Login | Apartment Rental System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(120deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: #fff;
            border-radius: 15px;
            padding: 35px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,.2);
        }

        .login-card h3 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
            color: #333;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px 15px;
        }

        .btn-login {
            border-radius: 10px;
            padding: 10px;
            font-weight: bold;
        }

        .brand {
            text-align: center;
            font-size: 14px;
            color: #888;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="login-card">
    <h3>🏢 Apartment System</h3>

    <form action="login_process.php" method="post">

        <div class="mb-3">
            <label>Username</label>
            <input type="text" name="username" class="form-control" placeholder="ຊື່ເຂົ້າລະບົບ" required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" placeholder="ລະຫັດຜ່ານ" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-login">
            🔐 Login
        </button>

    </form>

    <div class="brand">
        © 2026 Apartment Rental System
    </div>
</div>

</body>
</html>
